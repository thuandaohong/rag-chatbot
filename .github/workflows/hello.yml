name: Hello CI                 # tên workflow (hiện ở tab Actions)

on:                            # EVENT: khi nào chạy
  push:
    branches: [main]           # chỉ chạy khi push lên nhánh main
  workflow_dispatch:           # cho phép bấm chạy tay trên UI

jobs:
  say-hello:                   # tên job (tự đặt)
    runs-on: ubuntu-latest     # RUNNER: máy ảo Ubuntu do GitHub cấp
    steps:
      - name: Checkout code    # STEP 1: tải code repo về runner
        uses: actions/checkout@v4

      - name: In lời chào      # STEP 2: chạy lệnh shell
        run: echo "Hello từ GitHub Actions!"

      - name: Xem cấu trúc repo # STEP 3: liệt kê file
        run: ls -R
