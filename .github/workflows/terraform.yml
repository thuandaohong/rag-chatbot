name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]   # PR đụng infra -> plan
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]   # merge vào main -> apply
  workflow_dispatch:                                          # chạy tay apply (chỉ từ main)

permissions:
  id-token: write        # OIDC
  contents: read
  pull-requests: write   # để bot ghi kết quả plan vào PR

# Không cho 2 lần chạy Terraform chồng nhau (state lock cũng chặn, nhưng chặn sớm ở đây gọn hơn)
concurrency:
  group: terraform
  cancel-in-progress: false   # KHÔNG hủy apply đang chạy dở

env:
  TF_VERSION: "1.17.0"     # >= 1.10 (providers.tf yêu cầu, vì use_lockfile)
  TF_IN_AUTOMATION: "true" # bớt các gợi ý "chạy lệnh X tiếp theo" trong output
  AWS_REGION: us-east-1

jobs:
  # ---------- PLAN: chạy trên Pull Request, role CHỈ ĐỌC ----------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}   # rag-chatbot-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Ghi kết quả plan vào PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['(không thấy dòng tóm tắt)'])[0];
            const MAX = 60000;   // comment GitHub tối đa ~65k ký tự
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n... (bị cắt bớt, xem log của job)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan — \`${summary}\`\n<details><summary>Xem chi tiết</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Commit ${context.sha.slice(0, 7)}_`,
            });

  # ---------- APPLY: sau khi merge vào main, chờ duyệt, role GHI ----------
  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # Required reviewers -> job dừng chờ bấm Approve
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}  # rag-chatbot-tf-apply
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        # -auto-approve an toàn ở đây vì đã có 2 lớp chặn: review plan trên PR + Required reviewers
        run: terraform apply -input=false -auto-approve -no-color
